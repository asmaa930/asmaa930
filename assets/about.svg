<svg xmlns="http://www.w3.org/2000/svg" width="900" height="332" viewBox="0 0 900 332" role="img" aria-label="About me" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#3b2a8a"/></linearGradient>
<linearGradient id="dot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#6d4ce0"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="898" height="330" rx="22" fill="#0b0a1a" stroke="url(#bd)" stroke-width="2"/>
<circle cx="860" cy="30" r="120" fill="url(#gl)"><animate attributeName="r" values="120;140;120" dur="4s" repeatCount="indefinite"/></circle>
<text x="28" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="800" fill="#ffffff">I don’t just build web pages.</text>
<text x="28" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="800" fill="#a78bfa">I build experiences people enjoy using.</text>
<text x="28" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#cfc9ee">Front-end developer who turns designs into <tspan fill="#ffffff" font-weight="700">responsive, interactive interfaces</tspan>,</text>
<text x="28" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#cfc9ee">with clean, maintainable code in <tspan fill="#ffffff" font-weight="700">HTML, CSS/Sass, JavaScript, TypeScript and Angular</tspan>.</text>
<text x="28" y="176" font-family="'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#cfc9ee">I connect interfaces to real <tspan fill="#ffffff" font-weight="700">APIs</tspan> and publish what I build: <tspan fill="#ffffff" font-weight="700">Fokir, Kaffa,</tspan></text>
<text x="28" y="202" font-family="'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#cfc9ee"><tspan fill="#ffffff" font-weight="700">Gym Plus</tspan> and <tspan fill="#ffffff" font-weight="700">Delici</tspan> are live projects you can open and try.</text>
<rect x="24" y="224" width="273.3" height="84" rx="16" fill="#171433" stroke="#a78bfa" stroke-opacity=".3"/><circle cx="60" cy="266" r="19" fill="none" stroke="#c4b5fd" stroke-width="2"><animate attributeName="r" values="19;29" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="60" cy="266" r="19" fill="url(#dot)"/><rect x="50" y="258" width="14" height="10" rx="1.5" fill="#0b0a1a"/><rect x="54" y="269" width="6" height="2" fill="#0b0a1a"/>
<rect x="66" y="263" width="5" height="9" rx="1.2" fill="#0b0a1a"><animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" dur="1.8s" repeatCount="indefinite"/></rect><text x="92" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#ffffff">Responsive design</text><text x="92" y="284" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#cfc9ee">Adapts to every screen size</text>
<rect x="313.3" y="224" width="273.3" height="84" rx="16" fill="#171433" stroke="#a78bfa" stroke-opacity=".3"/><circle cx="349.3" cy="266" r="19" fill="none" stroke="#c4b5fd" stroke-width="2"><animate attributeName="r" values="19;29" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="349.3" cy="266" r="19" fill="url(#dot)"/><g fill="none" stroke="#0b0a1a" stroke-linecap="round" stroke-linejoin="round">
