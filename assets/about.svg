<animateTransform attributeName="transform" type="rotate" values="0 638.7 266;90 638.7 266" dur="3.6s" repeatCount="indefinite"/></path><text x="670.7" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#ffffff">Interactive UI</text><text x="670.7" y="284" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#cfc9ee">Smooth motion, real API data</text>
